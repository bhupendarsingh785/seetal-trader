# GitLab Pages - GitHub ke saath ek doosra live link.
# Mirror workflow is file ko GitLab par bhi bhej deta hai, aur GitLab khud site publish kar deta hai.

pages:
  stage: deploy
  image: alpine:latest
  script:
    - mkdir -p public
    - cp -r index.html assets data public/
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
