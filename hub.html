<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seetal — sab kuch ek jagah</title>
<style>
:root{--bg:#070a0e;--panel:#111820;--panel2:#18212b;--line:#243040;--text:#e9f0f7;--dim:#8b9bad;--green:#3ddc84;--blue:#64b5f6;--amber:#e0a44a;--red:#e57373}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);background:#0b1017;position:sticky;top:0;z-index:5}
.logo{font-weight:800;font-size:16px;letter-spacing:.3px}
.logo span{color:var(--green)}
.badge{font-size:9.5px;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:2px 7px;font-family:ui-monospace,monospace}
.spacer{flex:1}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:7px 11px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-block}
.btn:hover{background:var(--line)}
.tabs{display:flex;gap:7px;overflow-x:auto;padding:8px 10px;border-bottom:1px solid var(--line);background:#0b1017;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:20px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer}
.tab.on{background:var(--green);color:#04170c;border-color:var(--green)}
main{flex:1;position:relative;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;display:none}
iframe.on{display:block}
#home{position:absolute;inset:0;overflow:auto;padding:14px;display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:820px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;cursor:pointer;transition:.15s}
.card:hover{border-color:var(--green);transform:translateY(-1px)}
.card b{display:block;font-size:14.5px;margin-bottom:3px}
.card span{color:var(--dim);font-size:12px;line-height:1.45}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--dim);margin-right:5px;vertical-align:middle}
.dot.ok{background:var(--green)}
.hint{max-width:820px;margin:14px auto 0;color:var(--dim);font-size:12px;line-height:1.6;text-align:center}
@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header>
  <div class="logo">Seetal<span>.</span></div>
  <div class="badge" id="hstatus">check ho raha hai…</div>
  <div class="spacer"></div>
  <button class="btn" id="homeBtn">⌂ Home</button>
</header>

<div class="tabs" id="tabs"></div>

<main>
  <div id="home">
    <div class="grid" id="grid"></div>
    <div class="hint">Ek hi jagah — jo kholna hai, card dabao. Upar ke tabs se app badal sakte ho; Home ke liye ⌂.</div>
  </div>
  <iframe id="frame" title="app"></iframe>
</main>

<script>
const APPS = [
  {id:"trader",  name:"Trader",        desc:"live market pulse — entry, stop, target", path:"index.html",        emoji:"📈"},
  {id:"suno",    name:"Suno",          desc:"awaaz se baat — sunna, bolna, jawab",     path:"https://bhupendarsingh785.github.io/suno-assistant/", emoji:"🎙️"},
  {id:"studio",  name:"Studio (IDE)", desc:"file list + editor + build + run + deploy",  path:"studio.html",        emoji:"🧑‍💻"},
  {id:"builder", name:"Builder",       desc:"bol ke app aur system banao",             path:"builder.html",      emoji:"⚡"},
  {id:"doctor",  name:"Doctor",        desc:"system ki jaanch + purana version wapas", path:"doctor.html",       emoji:"🩺"},
  {id:"gyan",    name:"Gyan",          desc:"knowledge base",                          path:"gyan.html",         emoji:"📚"},
  {id:"vault",   name:"Vault",         desc:"password tijori (sirf phone me)",         path:"vault.html",        emoji:"🔐"},
  {id:"sync",    name:"Sync",          desc:"ek code — sab device same",               path:"sync-data.html",    emoji:"🔄"},
  {id:"status",  name:"Platforms",     desc:"sab platform ek nazar me",                path:"sync.html",         emoji:"🌐"},
  {id:"map",     name:"System map",    desc:"poora naksha",                            path:"status.html",       emoji:"🗺️"},
  {id:"api",     name:"Cloudflare API",desc:"seetal-api — /status /live /symbol",      path:"https://seetal-api.bhupendarsingh785.workers.dev/health", emoji:"☁️"},
  {id:"swag",    name:"Seetal Platform",desc:"tumhara naya dashboard — film, jarvis, agent", path:"https://bhupendarsingh785.github.io/swag-page/platform/", emoji:"🧩"},
  {id:"home",    name:"Ghar ka purana hub", desc:"purana darwaza",                    path:"hub-old.html",      emoji:"🏠"}
];

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

$("grid").innerHTML = APPS.map(a => `
  <div class="card" data-open="${a.id}">
    <b>${a.emoji} ${esc(a.name)}</b>
    <span>${esc(a.desc)}</span>
    <span style="display:block;margin-top:6px"><i class="dot" id="d-${a.id}"></i><span style="font-size:11px" id="t-${a.id}">check…</span></span>
  </div>`).join("");

$("tabs").innerHTML = APPS.map(a => `<div class="tab" data-open="${a.id}">${esc(a.name)}</div>`).join("");

function open(id){
  const app = APPS.find(a => a.id === id); if (!app) return;
  $("home").style.display = "none";
  const f = $("frame");
  f.classList.add("on");
  if (f.getAttribute("data-src") !== app.path){ f.src = app.path; f.setAttribute("data-src", app.path); }
  [...document.querySelectorAll(".tab")].forEach(t => t.classList.toggle("on", t.dataset.open === id));
  document.title = app.name + " — Seetal";
  history.replaceState(null, "", "#" + id);
}
function goHome(){
  $("frame").classList.remove("on");
  $("home").style.display = "block";
  [...document.querySelectorAll(".tab")].forEach(t => t.classList.remove("on"));
  document.title = "Seetal — sab kuch ek jagah";
  history.replaceState(null, "", "#home");
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-open]");
  if (el) open(el.dataset.open);
});
$("homeBtn").onclick = goHome;

async function check(){
  let ok = 0;
  await Promise.all(APPS.map(async a => {
    try{
      const r = await fetch(a.path + (a.path.includes("?") ? "&" : "?") + "v=" + Date.now(), { cache: "no-store", mode: "no-cors" });
      const good = r.ok || r.type === "opaque";
      if (good) ok++;
      const d = $("d-" + a.id), t = $("t-" + a.id);
      if (d) d.className = "dot" + (good ? " ok" : "");
      if (t) t.textContent = good ? "chalu" : "band";
    }catch(e){
      const t = $("t-" + a.id); if (t) t.textContent = "check nahi hua";
    }
  }));
  $("hstatus").textContent = ok + " / " + APPS.length + " chalu";
  $("hstatus").style.color = ok === APPS.length ? "var(--green)" : "var(--amber)";
}
check();

const h = (location.hash || "").replace("#", "");
if (h && h !== "home" && APPS.some(a => a.id === h)) open(h); else goHome();
</script>
</body>
</html>
