<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Seetal Studio — code likho, build karo, chalao</title>
<link rel="manifest" href="manifest-studio.webmanifest" />
<meta name="theme-color" content="#0b0f19" />
<link rel="icon" href="icon-192.png" />
<style>
  :root{--bg:#0b0f19;--panel:#121a26;--panel2:#182231;--line:#26324b;--txt:#eef2fb;--dim:#94a3c4;
        --green:#34d399;--red:#fb7185;--amber:#fbbf24;--violet:#7c6cf8;--cyan:#22d3ee}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#0e1520;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .logo{font-weight:800;font-size:14.5px}
  .logo span{color:var(--green)}
  .spacer{flex:1}
  button{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 10px;
         font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
  button.pri{background:linear-gradient(135deg,var(--violet),#3b82f6);border:none}
  button.ok{background:var(--green);color:#04170c;border:none}
  button:disabled{opacity:.45}
  main{flex:1;display:flex;min-height:0}
  #side{width:150px;min-width:110px;background:#0e1520;border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:auto}
  .file{padding:11px 10px;font-size:13px;color:var(--dim);cursor:pointer;border-bottom:1px solid rgba(255,255,255,.04);
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
  .file .ico{font-size:13px;opacity:.85}
  .file.on{background:var(--panel2);color:var(--txt);border-left:3px solid var(--green);font-weight:700}
  #editorWrap{flex:1;display:flex;flex-direction:column;min-width:0}
  #tabbar{display:flex;gap:6px;padding:6px 8px;background:#0e1520;border-bottom:1px solid var(--line);font-size:12px;color:var(--dim);overflow:auto}
  #codeArea{flex:1;display:flex;min-height:0;position:relative}
  #lines{width:44px;background:#0a0f18;color:#4b5b73;font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;
         text-align:right;padding:10px 6px;overflow:hidden;user-select:none}
  #code{flex:1;background:#0a0f18;color:#e8f0fb;border:0;outline:none;resize:none;
        font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;padding:10px;tab-size:2}
  #bottom{height:38%;min-height:120px;border-top:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel)}
  #outHead{display:flex;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);align-items:center;font-size:12px;color:var(--dim)}
  #outBody{flex:1;overflow:auto;padding:8px 10px;font-size:12.5px;line-height:1.65}
  iframe{width:100%;height:100%;border:0;background:#fff}
  .ok{color:var(--green)} .bad{color:var(--red)} .warn{color:var(--amber)}
  .pill{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:2px 8px;font-size:11px}
  @media(max-width:640px){ #side{width:112px} #bottom{height:44%} }
</style>
</head>
<body>

<header>
  <div class="logo">Seetal<span>.</span>Studio</div>
  <span class="pill" id="projName">naya-project</span>
  <div class="spacer"></div>
  <button id="newFile">＋ File</button>
  <button id="delFile">🗑</button>
  <button id="tpl">🧩 Template</button>
  <button id="ai">🤖 AI</button>
  <button id="make">✨ Poora app</button>
  <button id="brain">🔌 Dimaag</button>
  <button id="imp">⬇️ Import</button>
  <button id="find">🔎</button>
  <button id="dl">⬇️ Download</button>
  <button id="installBtn" onclick="doInstall()" style="display:none">📲 Install</button>
  <button class="pri" id="build">🔨 Build</button>
  <button class="ok" id="run">▶ Run</button>
  <button id="deploy">🚀 Deploy</button>
  <button id="saveAll">💾 Save</button>
</header>

<main>
  <div id="side"></div>
  <div id="editorWrap">
    <div id="tabbar"><span id="curFile">index.html</span><span class="spacer"></span><span id="stat"></span></div>
    <div id="codeArea">
      <div id="lines">1</div>
      <textarea id="code" spellcheck="false" wrap="off"></textarea>
    </div>
  </div>
</main>

<div id="statusbar" style="display:flex;gap:14px;align-items:center;padding:5px 10px;background:#0b1017;
     border-top:1px solid var(--line);font-size:11.5px;color:var(--dim)">
  <span id="sbFile">index.html</span>
  <span id="sbLines">0 line</span>
  <span class="spacer" style="flex:1"></span>
  <span id="sbBuild">taiyar</span>
</div>

<div id="bottom">
  <div id="outHead">
    <span>Output</span>
    <span class="spacer" style="flex:1"></span>
    <button id="clearOut" style="padding:4px 8px;font-size:11px">saaf</button>
  </div>
  <div id="outBody"><div class="ok">Taiyar. File chuno, likho, Build dabao — phir Run.</div></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const LS = "seetal.studio.v1";

/* ---------- project ---------- */
const DEFAULT = {
  name: "naya-project",
  files: {
    "index.html": `<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mera app</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Namaste</h1>
  <p>Ye Seetal Studio me bana hai.</p>
  <script src="app.js"><\/script>
</body>
</html>`,
    "style.css": `body{margin:0;font-family:system-ui;background:#0b0f19;color:#eef2fb;padding:20px}
h1{font-size:22px}`,
    "app.js": `console.log("app chalu");`,
  },
};

let P = load();
let cur = "index.html";

function load(){
  try{
    const raw = localStorage.getItem(LS);
    if (raw){ const p = JSON.parse(raw); if (p && p.files && Object.keys(p.files).length) return p; }
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT));
}
function save(){
  try{ localStorage.setItem(LS, JSON.stringify(P)); return true; }catch(e){ return false; }
}

/* ---------- ui ---------- */
function paintFiles(){
  const box = $("side");
  const ico = (f) => /\.html$/i.test(f) ? "🌐" : /\.css$/i.test(f) ? "🎨" : /\.js$/i.test(f) ? "⚙️" : "📄";
  box.innerHTML = Object.keys(P.files).map(f =>
    `<div class="file${f === cur ? " on" : ""}" data-f="${f}"><span class="ico">${ico(f)}</span>${f}</div>`).join("");
  box.querySelectorAll("[data-f]").forEach(el => el.onclick = () => openFile(el.dataset.f));
  $("projName").textContent = P.name || "project";
}

function openFile(f){
  if (!(f in P.files)) return;
  cur = f;
  $("code").value = P.files[f];
  $("curFile").textContent = f;
  if ($("sbFile")) $("sbFile").textContent = f;
  paintLines(); paintFiles();
}

function paintLines(){
  const n = ($("code").value.match(/\n/g) || []).length + 1;
  $("lines").textContent = Array.from({length: n}, (_, i) => i + 1).join("\n");
  $("stat").textContent = n + " line · " + $("code").value.length + " akshar";
  if ($("sbLines")) $("sbLines").textContent = n + " line";
  if ($("sbFile")) $("sbFile").textContent = f;
}

$("code").addEventListener("input", () => { P.files[cur] = $("code").value; paintLines(); save(); });
$("code").addEventListener("scroll", () => { $("lines").scrollTop = $("code").scrollTop; });
$("code").addEventListener("keydown", (e) => {
  if (e.key === "Tab"){ e.preventDefault();
    const el = $("code"), s = el.selectionStart, en = el.selectionEnd;
    el.value = el.value.slice(0, s) + "  " + el.value.slice(en);
    el.selectionStart = el.selectionEnd = s + 2;
    P.files[cur] = el.value; paintLines(); save();
  }
});

$("newFile").onclick = () => {
  const n = prompt("File ka naam (jaise page2.html, app.js, style.css):");
  if (!n) return;
  const name = n.trim().replace(/[^\w.\-]/g, "");
  if (!name) return;
  P.files[name] = "";
  save(); openFile(name);
};

$("delFile").onclick = () => {
  if (Object.keys(P.files).length <= 1){ out("bad", "Aakhri file nahi hata sakte."); return; }
  if (!confirm(cur + " hatana hai?")) return;
  delete P.files[cur];
  cur = Object.keys(P.files)[0];
  save(); openFile(cur);
};

$("saveAll").onclick = () => { out(save() ? "ok" : "bad", save() ? "Save ho gaya (is phone me)." : "Save nahi hua — storage bhara hai."); };
$("clearOut").onclick = () => { $("outBody").innerHTML = ""; };

function out(cls, msg){
  const d = document.createElement("div");
  d.className = cls; d.innerHTML = msg;
  $("outBody").appendChild(d);
  $("outBody").scrollTop = $("outBody").scrollHeight;
}

/* ---------- build (asli jaanch) ---------- */
function checkJS(code){
  try{ new Function(code); return { ok: true }; }
  catch(e){ return { ok: false, why: String(e.message).slice(0, 90) }; }
}
function checkHTML(code){
  if (!/<html[\s>]/i.test(code)) return { ok: false, why: "<html> nahi mila" };
  if (!/<\/html>/i.test(code)) return { ok: false, why: "</html> band nahi hua" };
  if (!/<body/i.test(code)) return { ok: false, why: "<body> nahi mila" };
  return { ok: true };
}
function checkCSS(code){
  const o = (code.match(/{/g) || []).length, c = (code.match(/}/g) || []).length;
  return Math.abs(o - c) > 2 ? { ok: false, why: "braces mel nahi kha rahe (" + o + "/" + c + ")" } : { ok: true };
}

function build(){
  $("outBody").innerHTML = "";
  const names = Object.keys(P.files);
  let fail = 0, warn = 0;

  names.forEach(f => {
    const code = P.files[f];
    let r = { ok: true };
    if (/\.js$/i.test(f)) r = checkJS(code);
    else if (/\.html$/i.test(f)) r = checkHTML(code);
    else if (/\.css$/i.test(f)) r = checkCSS(code);

    if (!r.ok){ fail++; out("bad", "❌ " + f + " — " + r.why); }
    else out("ok", "✅ " + f + " theek (" + code.split("\n").length + " line)");
  });

  // link check
  const html = P.files["index.html"] || "";
  const refs = [...html.matchAll(/(?:href|src)="((?!https?:|#|data:)[^"]+)"/g)].map(m => m[1]);
  refs.forEach(r => {
    if (r.includes("${")) return;
    if (!(r in P.files)){ warn++; out("warn", "⚠️ " + r + " ka file nahi hai (link toota)"); }
  });

  // quality hints
  if (!/<meta[^>]+viewport/i.test(html)) { warn++; out("warn", "⚠️ mobile viewport nahi — phone par theek nahi dikhega"); }
  if (!/localStorage/i.test(names.map(n => P.files[n]).join(""))) { warn++; out("warn", "⚠️ data save (localStorage) nahi hai — refresh par sab chala jayega"); }
  if (!/try\s*\{/.test(names.map(n => P.files[n]).join(""))) { warn++; out("warn", "⚠️ try/catch nahi — kuch toota to page blank ho sakta hai"); }

  const total = names.length;
  out(fail ? "bad" : (warn ? "warn" : "ok"),
      (fail ? "🔴 BUILD FAIL" : "🟢 BUILD PASS") + " — " + total + " file, " + fail + " tooti, " + warn + " chetavni");
  save();
  return fail === 0;
}

/* ---------- run ---------- */
function bundle(){
  let html = P.files["index.html"] || Object.values(P.files)[0] || "";
  const css = P.files["style.css"], js = P.files["app.js"];
  if (css) html = html.replace(/<link[^>]*style\.css[^>]*>/i, "<style>" + css + "</style>");
  if (js){
    const open = '<script src="app.js"></' + "script>";
    html = html.split(open).join("<script>" + js + "</" + "script>");
  }
  return html;
}

$("run").onclick = () => {
  if (!build()){ out("bad", "Pehle build theek karo."); }
  const html = bundle();
  const box = document.createElement("iframe");
  box.style.cssText = "width:100%;height:100%;border:0;background:#fff";
  $("outBody").innerHTML = "";
  $("outBody").style.padding = "0";
  $("outBody").appendChild(box);
  box.srcdoc = html;
  out("ok", "▶ Chal raha hai — upar preview.");
  $("outBody").style.padding = "0";
};

/* ---------- deploy (GitHub) ---------- */
$("deploy").onclick = async () => {
  const token = prompt("GitHub token (Contents: write):");
  if (!token) return;
  const repo = prompt("repo — jaise bhupendarsingh785/my-app");
  if (!repo || !repo.includes("/")){ out("bad", "repo galat hai."); return; }
  const [owner, name] = repo.split("/");
  $("outBody").innerHTML = ""; $("outBody").style.padding = "8px 10px";
  out("warn", "Deploy kar raha hoon…");

  for (const f of Object.keys(P.files)){
    const api = "https://api.github.com/repos/" + owner + "/" + name + "/contents/" + encodeURIComponent(f);
    const headers = { Authorization: "Bearer " + token.trim(), Accept: "application/vnd.github+json", "Content-Type": "application/json" };
    try{
      let sha = null;
      const r0 = await fetch(api + "?ref=main", { headers });
      if (r0.ok) sha = (await r0.json()).sha;
      const body = { message: "Seetal Studio: " + f, content: btoa(unescape(encodeURIComponent(P.files[f]))), branch: "main" };
      if (sha) body.sha = sha;
      const r = await fetch(api, { method: "PUT", headers, body: JSON.stringify(body) });
      if (!r.ok){ const j = await r.json().catch(() => ({})); out("bad", "❌ " + f + " — " + (j.message || r.status)); }
      else out("ok", "✅ " + f + " chala gaya");
    }catch(e){ out("bad", "❌ " + f + " — " + e.message); }
  }
  out("ok", "Live link (1-2 min): https://" + owner.toLowerCase() + ".github.io/" + name + "/");
};


/* ================= dimaag: kai model ================= */
const CLOSE_S = "<" + "/script>";
const BRAIN_KEY = "seetal.studio.brain.v1";
const BRAINS = {
  sarvam:   { url:"https://api.sarvam.ai/v1/chat/completions", model:"sarvam-m", auth:"api-subscription-key", prefix:"", openai:true },
  gemini:   { gemini:true, model:"gemini-2.0-flash" },
  anthropic:{ url:"https://api.anthropic.com/v1/messages", model:"claude-3-5-haiku-20241022", anthropic:true },
  openai:   { url:"https://api.openai.com/v1/chat/completions", model:"gpt-4o-mini", auth:"Authorization", prefix:"Bearer ", openai:true },
  deepseek: { url:"https://api.deepseek.com/v1/chat/completions", model:"deepseek-chat", auth:"Authorization", prefix:"Bearer ", openai:true },
  kimi:     { url:"https://api.moonshot.cn/v1/chat/completions", model:"moonshot-v1-8k", auth:"Authorization", prefix:"Bearer ", openai:true },
  groq:     { url:"https://api.groq.com/openai/v1/chat/completions", model:"llama-3.1-8b-instant", auth:"Authorization", prefix:"Bearer ", openai:true },
  none:     { free:true, model:"free" }
};
function bGet(){ try{ return JSON.parse(localStorage.getItem(BRAIN_KEY) || "null"); }catch(e){ return null; } }
function bSet(v){ try{ localStorage.setItem(BRAIN_KEY, JSON.stringify(v)); }catch(e){} }

async function bAsk(prompt, ms){
  const c = bGet();
  if (c && c.key && c.provider && c.provider !== "none"){
    const B = BRAINS[c.provider];
    if (B && !B.free){
      const model = c.model || B.model;
      const ctl = new AbortController();
      const to = setTimeout(() => ctl.abort(), ms || 30000);
      try{
        if (B.gemini){
          const url = "https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent?key=" + encodeURIComponent(c.key);
          const r = await fetch(url, { method:"POST", headers:{ "Content-Type":"application/json" },
            body: JSON.stringify({ contents:[{ parts:[{ text: prompt }] }] }), signal: ctl.signal });
          const j = await r.json();
          if (j.error) throw new Error("gemini");
          const t = j.candidates && j.candidates[0].content.parts[0].text;
          if (t) return t.trim();
        } else if (B.anthropic){
          const r = await fetch(B.url, { method:"POST",
            headers:{ "Content-Type":"application/json", "x-api-key": c.key, "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" },
            body: JSON.stringify({ model, max_tokens: 3000, messages:[{ role:"user", content: prompt }] }), signal: ctl.signal });
          const j = await r.json();
          if (j.error) throw new Error("anthropic");
          const t = j.content && j.content[0] && j.content[0].text;
          if (t) return t.trim();
        } else {
          const headers = { "Content-Type":"application/json" };
          headers[B.auth] = (B.prefix || "") + c.key;
          const r = await fetch(B.url, { method:"POST", headers,
            body: JSON.stringify({ model, temperature:0.4, messages:[{ role:"user", content: prompt }] }), signal: ctl.signal });
          const j = await r.json();
          if (j.error) throw new Error("api");
          const t = j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
          if (t) return t.trim();
        }
      }catch(e){}
      finally{ clearTimeout(to); }
    }
  }
  try{ if (window.SeetalAPIs){ const a = await SeetalAPIs.ask(prompt, { timeout: ms || 25000 }); if (a.ok) return a.text; } }catch(e){}
  return null;
}

$("ai").onclick = async () => {
  const ask = prompt("AI se kya karwana hai? (jaise: 'is file me search box jodo')");
  if (!ask) return;
  out("warn", "🤖 AI likh raha hai…");
  const prompt2 = "Tum expert developer ho. Neeche ek file hai. User ne kaha: \"" + ask + "\". "
    + "Sirf poora naya file content do — koi explanation nahi, koi code fence nahi. Mobile-first, Hinglish UI, bade touch buttons, chhote comments.\n\n"
    + "File: " + cur + "\n\n" + P.files[cur];
  const ansRaw = await bAsk(prompt2, 30000);
  if (!ansRaw){ out("bad", "❌ AI se jawab nahi aaya — 🔌 Dimaag me key daalo."); return; }
  const ans = ansRaw.replace(/^```[a-z]*\n?/i, "").replace(/```$/, "").trim();
  if (!confirm("AI ne naya code bheja. Badal dun?")) return;
  P.files[cur] = ans; $("code").value = ans; paintLines(); save();
  out("ok", "✅ " + cur + " update ho gayi — Build dabao.");
};

$("make").onclick = async () => {
  const idea = prompt("Kaisa app banao? ek line me:\n(jaise: 'padhaai ka timetable jo save ho')");
  if (!idea) return;
  out("warn", "✨ AI poora app bana raha hai… (10-20 second)");
  const prompt2 = "Tum expert web developer ho. Ek chhota app banao is idea par: \"" + idea + "\".\n"
    + "Sirf JSON do: {\"name\":\"app-naam\",\"files\":{\"index.html\":\"...\",\"style.css\":\"...\",\"app.js\":\"...\"}}\n"
    + "Niyam: viewport meta, style.css/app.js se link, mobile-first, bade buttons, Hinglish, localStorage, try/catch, chhote comments. Sirf JSON.";
  let ans = await bAsk(prompt2, 40000);
  if (!ans){ out("bad", "❌ AI se jawab nahi aaya — 🔌 Dimaag me key daalo."); return; }
  ans = ans.replace(/^```[a-z]*\n?/i, "").replace(/```$/, "").trim();
  const a = ans.indexOf("{"), b = ans.lastIndexOf("}");
  let data = null;
  try{ data = JSON.parse(ans.slice(a, b + 1)); }catch(e){}
  if (!data || !data.files){ out("bad", "❌ AI ka jawab samajh nahi aaya — dobara bolo."); return; }
  if (!confirm("AI ne " + Object.keys(data.files).length + " file banayi. Purani badal dun?")) return;
  P = { name: (data.name || "ai-app").replace(/[^\w\-]/g, ""), files: data.files };
  cur = P.files["index.html"] ? "index.html" : Object.keys(P.files)[0];
  save(); paintFiles(); openFile(cur); build();
};

$("imp").onclick = async () => {
  const repo = prompt("GitHub repo — jaise bhupendarsingh785/my-app");
  if (!repo || !repo.includes("/")) return;
  const [owner, name] = repo.split("/");
  out("warn", "⬇️ La raha hoon…");
  try{
    const r = await fetch("https://api.github.com/repos/" + owner + "/" + name + "/git/trees/main?recursive=1");
    const j = await r.json();
    const list = (j.tree || []).filter(x => x.type === "blob" && /\.(html|css|js|json|md)$/i.test(x.path) && x.size < 200000).slice(0, 12);
    if (!list.length){ out("bad", "Koi text file nahi mili."); return; }
    if (!confirm(list.length + " file mili. Purani badal dun?")) return;
    const files = {};
    for (const f of list){
      const raw = await fetch("https://raw.githubusercontent.com/" + owner + "/" + name + "/main/" + f.path);
      if (raw.ok) files[f.path] = await raw.text();
    }
    P = { name: name, files };
    cur = files["index.html"] ? "index.html" : Object.keys(files)[0];
    save(); paintFiles(); openFile(cur);
    out("ok", "✅ " + Object.keys(files).length + " file aa gayi.");
  }catch(e){ out("bad", "❌ Import fail: " + e.message); }
};

$("find").onclick = () => {
  const q = prompt("Kya dhoondhna hai?");
  if (!q) return;
  $("outBody").innerHTML = "";
  let n = 0;
  Object.keys(P.files).forEach(f => {
    P.files[f].split("\n").forEach((line, i) => {
      if (line.toLowerCase().includes(q.toLowerCase())){ n++; out("ok", "<b>" + f + ":" + (i+1) + "</b> — " + line.trim().slice(0,80)); }
    });
  });
  if (!n) out("warn", "Kuch nahi mila.");
};

$("dl").onclick = () => {
  const html = bundle();
  const name = (P.name || "app").replace(/[^\w\-]/g, "") + ".html";
  const blob = new Blob([html], { type: "text/html;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  out("ok", "⬇️ " + name + " download — phone me offline chalega.");
};
