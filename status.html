<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Seetal — System Map</title>
<style>
  :root{--bg:#0a0e14;--panel:#111823;--line:#1e2a3a;--txt:#e6edf6;--dim:#8496ad;--green:#22c55e;--red:#ef4444;--amber:#f59e0b;--violet:#8b5cf6;--blue:#3b82f6}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1000px 500px at 80% -10%,#12203a,transparent 60%),var(--bg);color:var(--txt);
       font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;padding:0 0 40px}
  header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .brand{display:flex;gap:10px;align-items:center}
  .logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,var(--violet),var(--blue))}
  h1{font-size:17px;margin:0}
  .sub{margin:2px 0 0;color:var(--dim);font-size:12px}
  main{max-width:820px;margin:0 auto;padding:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06)}
  .row:last-child{border-bottom:none}
  .name{font-weight:700}
  .url{font-size:11.5px;color:var(--dim);word-break:break-all}
  .badge{font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;border:1px solid;white-space:nowrap}
  .ok{color:var(--green);border-color:rgba(34,197,94,.45);background:rgba(34,197,94,.1)}
  .bad{color:var(--red);border-color:rgba(239,68,68,.45);background:rgba(239,68,68,.1)}
  .wait{color:var(--amber);border-color:rgba(245,158,11,.45);background:rgba(245,158,11,.1)}
  .btn{background:linear-gradient(180deg,#2b3b52,#1d2a3b);color:var(--txt);border:1px solid var(--line);padding:10px 15px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer}
  .sum{font-size:14px;margin-bottom:12px}
  h2{font-size:14px;color:var(--violet);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.5px}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">SM</div>
    <div>
      <h1>System Map</h1>
      <p class="sub">Har platform ek doosre ka backup — abhi ka sach</p>
    </div>
  </div>
  <button class="btn" id="run">Abhi check karo</button>
</header>

<main>
  <div class="sum" id="sum">Check kar raha hoon…</div>

  <h2>Live sites</h2>
  <div class="card" id="sites"></div>

  <h2>Data ke raste</h2>
  <div class="card" id="data"></div>

  <h2>Code aur database</h2>
  <div class="card" id="infra"></div>

  <p class="sub" style="margin-top:16px">Ye page har link ko seedha browser se kholta hai aur batata hai kaun zinda hai, kaun nahi. Jo laal hai, woh aaj nahi chal raha — baaki chalte rehte hain.</p>
</main>

<script>
const SITES = [
  { name: "GitHub Pages", url: "https://bhupendarsingh785.github.io/seetal-trader/" },
  { name: "Netlify", url: "https://seetal-trader.netlify.app/" },
  { name: "Vercel", url: "https://bhupendarsingh785.vercel.app/" },
];

const DATA = [
  { name: "GitHub raw", url: "https://raw.githubusercontent.com/bhupendarsingh785/seetal-trader/main/data/live.json", json: true },
  { name: "jsDelivr CDN", url: "https://cdn.jsdelivr.net/gh/bhupendarsingh785/seetal-trader@main/data/live.json", json: true },
  { name: "GitLab raw", url: "https://gitlab.com/Bhuprndar785/bhupendarsingh785/-/raw/main/data/live.json", json: true },
  { name: "GitHub Pages data", url: "https://bhupendarsingh785.github.io/seetal-trader/data/live.json", json: true },
  {
    name: "Supabase",
    url: "https://urvhrcyuqepzpbklonrz.supabase.co/rest/v1/snapshots?select=payload&order=generated_epoch.desc&limit=1",
    headers: { apikey: "sb_publishable_R1qExbRPEz5d-8YEpDUc_Q_dSel34jw", Authorization: "Bearer sb_publishable_R1qExbRPEz5d-8YEpDUc_Q_dSel34jw" },
    supabase: true,
  },
];

const INFRA = [
  { name: "GitHub repo", url: "https://github.com/bhupendarsingh785/seetal-trader" },
  { name: "GitLab mirror", url: "https://gitlab.com/Bhuprndar785/bhupendarsingh785" },
  { name: "Supabase project", url: "https://supabase.com/dashboard/project/urvhrcyuqepzpbklonrz" },
];

function row(name, url, state, note) {
  const cls = state === "ok" ? "ok" : state === "bad" ? "bad" : "wait";
  const label = state === "ok" ? "✅ chal raha" : state === "bad" ? "❌ nahi chala" : "…";
  return `<div class="row">
    <div style="min-width:0">
      <div class="name">${name}</div>
      <div class="url">${url}</div>
      ${note ? `<div class="url">${note}</div>` : ""}
    </div>
    <span class="badge ${cls}">${label}</span>
  </div>`;
}

function render(boxId, list, results) {
  document.getElementById(boxId).innerHTML = list
    .map((item, i) => {
      const r = results[i] || { state: "wait" };
      return row(item.name, item.url, r.state, r.note);
    })
    .join("");
}

async function check(item) {
  const t0 = performance.now();
  try {
    const ctl = new AbortController();
    const to = setTimeout(() => ctl.abort(), 9000);
    const res = await fetch(item.url + (item.url.includes("?") ? "&" : "?") + "t=" + Date.now(), {
      cache: "no-store",
      signal: ctl.signal,
      headers: item.headers || undefined,
    });
    clearTimeout(to);
    const ms = Math.round(performance.now() - t0);
    if (!res.ok) return { state: "bad", note: "http " + res.status + " · " + ms + "ms" };
    if (item.json || item.supabase) {
      const j = await res.json();
      let d = j;
      if (item.supabase) d = Array.isArray(j) && j.length ? j[0].payload : null;
      if (!d || !Array.isArray(d.rows) || !d.rows.length) return { state: "bad", note: "khaali data · " + ms + "ms" };
      const gen = d.generated_at ? new Date(d.generated_at).toLocaleString("en-IN", { hour: "2-digit", minute: "2-digit", day: "2-digit", month: "short" }) : "?";
      return { state: "ok", note: d.rows.length + " symbols · " + gen + " · " + ms + "ms" };
    }
    return { state: "ok", note: ms + "ms" };
  } catch (e) {
    return { state: "bad", note: String(e && e.message || e).slice(0, 60) };
  }
}

async function runAll() {
  const sum = document.getElementById("sum");
  sum.textContent = "Check kar raha hoon…";
  render("sites", SITES, []);
  render("data", DATA, []);
  render("infra", INFRA, []);

  const s = await Promise.all(SITES.map(check));
  render("sites", SITES, s);
  const d = await Promise.all(DATA.map(check));
  render("data", DATA, d);
  const i = await Promise.all(INFRA.map(check));
  render("infra", INFRA, i);

  const all = [...s, ...d, ...i];
  const ok = all.filter((x) => x.state === "ok").length;
  sum.innerHTML = `<b>${ok}/${all.length}</b> zinda hain — ` +
    (ok === all.length ? "sab kuch juda hua aur chal raha hai ✅" : "kuch laal hain, par baaki se kaam chalta rahega.");
}

document.getElementById("run").onclick = runAll;
runAll();
setInterval(runAll, 120000);
</script>
</body>
</html>
