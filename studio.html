<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Seetal Studio — phone se app banao</title>
<style>
  :root{--bg:#0b0f19;--panel:#121a26;--panel2:#182231;--line:#26324b;--txt:#eef2fb;--dim:#94a3c4;
        --green:#34d399;--red:#fb7185;--amber:#fbbf24;--violet:#7c6cf8;--cyan:#22d3ee;--code:#0a0f18}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;
       display:flex;flex-direction:column;overflow:hidden;font-size:15px}

  header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#0e1520;border-bottom:1px solid var(--line)}
  .logo{font-weight:800;font-size:15px;white-space:nowrap}
  .logo span{color:var(--green)}
  #projName{font-size:12px;color:var(--dim);background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:3px 9px;
            max-width:38vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .spacer{flex:1}
  .ibtn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:9px 11px;font-size:15px;cursor:pointer}
  .ibtn:active{transform:scale(.97)}

  main{flex:1;min-height:0;position:relative}
  .view{position:absolute;inset:0;display:none;overflow:auto}
  .view.on{display:block}

  /* files */
  .frow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 14px;border-bottom:1px solid rgba(255,255,255,.05);font-size:14.5px}
  .frow:active{background:var(--panel2)}
  .frow .nm{font-weight:600}
  .frow .del{background:transparent;border:1px solid var(--line);color:var(--red);border-radius:8px;padding:5px 9px;font-size:12px}
  .bigbtn{margin:14px;display:block;width:calc(100% - 28px);background:var(--panel2);border:1px dashed var(--line);color:var(--txt);
          border-radius:12px;padding:14px;font-size:14.5px;font-weight:700}

  /* code */
  #codeView{display:none;flex-direction:column}
  #codeView.on{display:flex}
  #snip{display:flex;gap:6px;overflow:auto;padding:8px 10px;background:#0e1520;border-bottom:1px solid var(--line)}
  #snip button{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px;font-size:12.5px;
               font-family:ui-monospace,monospace;white-space:nowrap}
  #editorBox{flex:1;display:flex;min-height:0}
  #lines{width:38px;background:var(--code);color:#465a75;font:12.5px/1.6 ui-monospace,Menlo,Consolas,monospace;text-align:right;
         padding:10px 5px;overflow:hidden;user-select:none;border-right:1px solid #14202f}
  #code{flex:1;background:var(--code);color:#e8f0fb;border:0;outline:none;resize:none;
        font:13.5px/1.6 ui-monospace,Menlo,Consolas,monospace;padding:10px;tab-size:2}
  #curFile{padding:7px 12px;background:#0e1520;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--dim);
           display:flex;justify-content:space-between}

  /* build / preview */
  #outBody{padding:12px 14px;font-size:13.5px;line-height:1.75}
  .ok{color:var(--green)} .bad{color:var(--red)} .warn{color:var(--amber)}
  #prev{width:100%;height:100%;border:0;background:#fff}

  /* bottom nav */
  nav{display:flex;border-top:1px solid var(--line);background:#0e1520;padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;background:transparent;border:0;color:var(--dim);padding:11px 4px 13px;font-size:11.5px;font-weight:700;
             display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit}
  nav button .ic{font-size:18px}
  nav button.on{color:var(--green)}

  /* sheet */
  #sheet,#sheet2{position:fixed;inset:0;background:rgba(4,8,14,.7);display:none;align-items:flex-end;z-index:50}
  #sheet2.on{display:flex}
  #sheet.on{display:flex}
  #sheetInner,#sheet2Inner{background:var(--panel);border:1px solid var(--line);border-top-left-radius:18px;border-top-right-radius:18px;
              width:100%;max-height:78vh;overflow:auto;padding:14px}
  #sheetInner h3{margin:0 0 10px;font-size:15px}
  .srow{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
        border-radius:12px;padding:14px;margin-bottom:8px;font-size:14.5px;font-weight:600;font-family:inherit}
  .srow small{display:block;color:var(--dim);font-weight:400;font-size:12px;margin-top:3px}
  .close{width:100%;background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:12px;padding:12px;font-size:14px;margin-top:4px}

  /* ---------- computer / bade screen par ek saath sab ---------- */
  @media (min-width: 900px){
    nav{display:none}
    main{display:grid;grid-template-columns:220px 1fr 380px;gap:0}
    .view{position:relative;inset:auto;display:block !important;overflow:auto;border-right:1px solid var(--line)}
    #filesView{border-right:1px solid var(--line)}
    #codeView{display:flex !important;flex-direction:column;min-height:0}
    #buildView{border-right:0;border-left:1px solid var(--line)}
    #prevView{display:none !important}
    #editorBox{min-height:0}
    #code{font-size:14px}
    header{padding:8px 14px}
    .bigbtn{margin:12px;width:calc(100% - 24px)}
    /* preview ko build ke neeche dikhao */
    #buildView::after{content:"";display:block}
  }
  /* tablet */
  @media (min-width: 700px) and (max-width: 899px){
    main{display:grid;grid-template-columns:180px 1fr}
    nav{display:flex}
    #filesView{display:block !important}
    .view{position:relative;inset:auto}
    #codeView{display:flex !important;flex-direction:column}
    #buildView,#prevView{display:none}
    #buildView.on,#prevView.on{display:block;grid-column:1 / -1;height:45vh;border-top:1px solid var(--line)}
  }
</style>
</head>
<body>

<header>
  <div class="logo">Seetal<span>.</span>Studio</div>
  <div id="projName">project</div>
  <div class="spacer"></div>
  <button class="ibtn" id="menu">☰</button>
</header>

<main>
  <section class="view on" id="filesView">
    <div id="filesList"></div>
    <button class="bigbtn" id="addFile">＋ Nayi file banao</button>
  </section>

  <section class="view" id="codeView">
    <div id="curFile"><span id="fname">index.html</span><span id="stat"></span></div>
    <div id="snip"></div>
    <div id="editorBox">
      <div id="lines">1</div>
      <textarea id="code" spellcheck="false" wrap="off" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
    </div>
  </section>

  <section class="view" id="buildView">
    <div id="outBody"><div class="ok">Build dabao — har file jaanchi jayegi.</div></div>
  </section>

  <section class="view" id="prevView" style="padding:0">
    <iframe id="prev" title="preview"></iframe>
  </section>
</main>

<nav>
  <button data-v="files" class="on"><span class="ic">📁</span>Files</button>
  <button data-v="code"><span class="ic">⌨️</span>Code</button>
  <button data-v="build"><span class="ic">🔨</span>Build</button>
  <button data-v="prev"><span class="ic">▶️</span>Run</button>
</nav>

<div id="sheet2">
  <div id="sheet2Inner">
    <h3>Kaunsa app banao?</h3>
    <div id="tplList"></div>
    <button class="close" id="tBack">Wapas</button>
  </div>
</div>

<div id="sheet">
  <div id="sheetInner">
    <h3>Kya karna hai?</h3>
    <button class="srow" id="mTemplate">🧩 Template se shuru karo<small>khatabook · quiz · notes · todo</small></button>
    <button class="srow" id="mAI">🤖 AI se code likhwao<small>current file sudharo ya naya kaam bolo</small></button>
    <button class="srow" id="mImport">⬇️ GitHub se import<small>owner/repo likho, files aa jayengi</small></button>
    <button class="srow" id="mFind">🔎 Project me dhoondo<small>file aur line number ke saath</small></button>
    <button class="srow" id="mDownload">⬇️ Download (phone me rakho)<small>ek hi file, offline chalegi</small></button>
    <button class="srow" id="mDeploy">🚀 GitHub par deploy<small>token + repo, phir live link</small></button>
    <button class="srow" id="mRename">✏️ Project ka naam badlo</button>
    <button class="close" id="mClose">Band karo</button>
  </div>
</div>

<script src="assets/apis.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const LS = "seetal.studio.v3";
const CLOSE_SCRIPT = "<" + "/script>";

/* ---------------- templates ---------------- */
const T = {
  hello: { name:"Hello page", files:{
    "index.html": '<!-- Sabse aasan page: ek heading aur ek button -->\n<!DOCTYPE html>\n<html lang="hi">\n<head>\n  <meta charset="utf-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1">\n  <title>Mera pehla page</title>\n  <link rel="stylesheet" href="style.css">\n</head>\n<body>\n  <h1>Namaste!</h1>\n  <p>Ye mera pehla page hai.</p>\n  <button id="btn">Mujhe dabao</button>\n  <p id="out"></p>\n\n  <script src="app.js">' + CLOSE_SCRIPT + '\n</body>\n</html>',
    "style.css": '/* Thoda sa sundar look */\nbody {\n  font-family: system-ui;\n  background: #0b0f19;\n  color: white;\n  padding: 20px;\n}\nh1 { font-size: 24px; }\nbutton {\n  font-size: 16px;\n  padding: 12px 18px;\n  border-radius: 10px;\n  border: 0;\n  background: #7c6cf8;\n  color: white;\n}',
    "app.js": '// Button dabane par ye chalega\nconst btn = document.getElementById("btn");\nconst out = document.getElementById("out");\n\nbtn.onclick = function () {\n  out.textContent = "Shabash! Tumne button daba diya.";\n};'
  }},

  rang: { name:"Rang badlo", files:{
    "index.html": '<!DOCTYPE html>\n<html lang="hi">\n<head>\n  <meta charset="utf-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1">\n  <title>Rang badlo</title>\n  <link rel="stylesheet" href="style.css">\n</head>\n<body>\n  <h1>Rang badlo</h1>\n  <div id="box"></div>\n  <button id="btn">Naya rang</button>\n\n  <script src="app.js">' + CLOSE_SCRIPT + '\n</body>\n</html>',
    "style.css": 'body { font-family: system-ui; background: #0b0f19; color: white; padding: 20px; }\n#box {\n  height: 140px;\n  border-radius: 14px;\n  background: #7c6cf8;\n  margin: 14px 0;\n}\nbutton {\n  font-size: 16px;\n  padding: 12px 18px;\n  border-radius: 10px;\n  border: 0;\n  background: #34d399;\n  color: #04170c;\n}',
    "app.js": '// Har baar naya rang chuno\nconst box = document.getElementById("box");\n\nfunction nayaRang() {\n  const r = Math.floor(Math.random() * 255);\n  const g = Math.floor(Math.random() * 255);\n  const b = Math.floor(Math.random() * 255);\n  box.style.background = "rgb(" + r + "," + g + "," + b + ")";\n}\n\ndocument.getElementById("btn").onclick = nayaRang;'
  }},

  pahada: { name:"Pahada (table)", files:{
    "index.html": '<!DOCTYPE html>\n<html lang="hi">\n<head>\n  <meta charset="utf-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1">\n  <title>Pahada</title>\n  <link rel="stylesheet" href="style.css">\n</head>\n<body>\n  <h1>Pahada</h1>\n  <p>Kaunsa number? (jaise 5)</p>\n  <input id="num" type="number" value="5">\n  <button id="btn">Dikhao</button>\n  <div id="out"></div>\n\n  <script src="app.js">' + CLOSE_SCRIPT + '\n</body>\n</html>',
    "style.css": 'body { font-family: system-ui; background: #0b0f19; color: white; padding: 20px; }\ninput {\n  font-size: 16px;\n  padding: 10px;\n  width: 90px;\n  border-radius: 10px;\n  border: 1px solid #26324b;\n  background: #131b28;\n  color: white;\n}\nbutton {\n  font-size: 16px;\n  padding: 10px 16px;\n  border-radius: 10px;\n  border: 0;\n  background: #7c6cf8;\n  color: white;\n}\n#out { margin-top: 14px; font-size: 17px; line-height: 1.8; }',
    "app.js": '// 1 se 10 tak ka pahada\nconst num = document.getElementById("num");\nconst out = document.getElementById("out");\n\ndocument.getElementById("btn").onclick = function () {\n  const n = Number(num.value);\n  let text = "";\n  for (let i = 1; i <= 10; i++) {\n    text = text + n + " x " + i + " = " + (n * i) + "<br>";\n  }\n  out.innerHTML = text;\n};'
  }},

  khata: { name:"Khata (hisaab)", files:{
    "index.html": '<!DOCTYPE html>\n<html lang="hi">\n<head>\n  <meta charset="utf-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1">\n  <title>Khata</title>\n  <link rel="stylesheet" href="style.css">\n</head>\n<body>\n  <h1>Mera khata</h1>\n\n  <input id="naam" placeholder="Kis ka naam">\n  <input id="rupaye" type="number" placeholder="Kitne rupaye">\n  <button id="add">Jodo</button>\n\n  <div id="list"></div>\n  <p id="total"></p>\n\n  <script src="app.js">' + CLOSE_SCRIPT + '\n</body>\n</html>',
    "style.css": 'body { font-family: system-ui; background: #0b0f19; color: white; padding: 16px; }\ninput {\n  font-size: 16px; padding: 12px; width: 100%; margin-bottom: 8px;\n  border-radius: 10px; border: 1px solid #26324b; background: #131b28; color: white;\n}\nbutton {\n  font-size: 16px; padding: 12px; width: 100%; border-radius: 10px; border: 0;\n  background: #7c6cf8; color: white; font-weight: bold;\n}\n.ek { background: #131b28; border-radius: 10px; padding: 12px; margin-top: 8px; }\n#total { font-size: 19px; font-weight: bold; margin-top: 14px; }',
    "app.js": '// Sab kuch phone ki memory me save hota hai\nlet khata = JSON.parse(localStorage.getItem("khata") || "[]");\n\nfunction dikhao() {\n  let html = "";\n  let total = 0;\n\n  for (let i = 0; i < khata.length; i++) {\n    html = html + \'<div class="ek">\' + khata[i].naam + " — Rs " + khata[i].rupaye + "</div>";\n    total = total + Number(khata[i].rupaye);\n  }\n\n  document.getElementById("list").innerHTML = html;\n  document.getElementById("total").textContent = "Total: Rs " + total;\n  localStorage.setItem("khata", JSON.stringify(khata));\n}\n\ndocument.getElementById("add").onclick = function () {\n  const naam = document.getElementById("naam").value;\n  const rupaye = document.getElementById("rupaye").value;\n\n  if (naam === "" || rupaye === "") return;\n\n  khata.push({ naam: naam, rupaye: rupaye });\n  document.getElementById("naam").value = "";\n  document.getElementById("rupaye").value = "";\n  dikhao();\n};\n\ndikhao();'
  }},

  quiz: { name:"Quiz (sawal-jawab)", files:{
    "index.html": '<!DOCTYPE html>\n<html lang="hi">\n<head>\n  <meta charset="utf-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1">\n  <title>Quiz</title>\n  <link rel="stylesheet" href="style.css">\n</head>\n<body>\n  <h1 id="sawal">Sawal</h1>\n  <div id="jawab"></div>\n  <p id="result"></p>\n\n  <script src="app.js">' + CLOSE_SCRIPT + '\n</body>\n</html>',
    "style.css": 'body { font-family: system-ui; background: #0b0f19; color: white; padding: 16px; }\nh1 { font-size: 20px; }\nbutton {\n  display: block; width: 100%; font-size: 16px; padding: 15px; margin: 8px 0;\n  border-radius: 12px; border: 1px solid #26324b; background: #131b28; color: white;\n  text-align: left;\n}\n.sahi { background: #0f3d2a; border-color: #34d399; }\n.galat { background: #3d1520; border-color: #fb7185; }',
    "app.js": '// Apne sawal yahan badlo\nconst sawal = [\n  { puchho: "Bharat ki rajdhani kaun hai?", jawab: ["Mumbai", "Delhi", "Patna"], sahi: 1 },\n  { puchho: "2 + 2 kitna hota hai?", jawab: ["3", "4", "5"], sahi: 1 },\n  { puchho: "Sabse bada grah kaunsa hai?", jawab: ["Prithvi", "Shukra", "Brihaspati"], sahi: 2 }\n];\n\nlet kaunsa = 0;\nlet score = 0;\n\nfunction dikhao() {\n  if (kaunsa >= sawal.length) {\n    document.getElementById("sawal").textContent = "Khatam!";\n    document.getElementById("jawab").innerHTML = "";\n    document.getElementById("result").textContent = "Tumhare " + score + " / " + sawal.length + " sahi";\n    return;\n  }\n\n  const s = sawal[kaunsa];\n  document.getElementById("sawal").textContent = (kaunsa + 1) + ". " + s.puchho;\n  document.getElementById("jawab").innerHTML = "";\n\n  for (let i = 0; i < s.jawab.length; i++) {\n    const b = document.createElement("button");\n    b.textContent = s.jawab[i];\n    b.onclick = function () {\n      if (i === s.sahi) { b.className = "sahi"; score++; }\n      else { b.className = "galat"; }\n      setTimeout(function () { kaunsa++; dikhao(); }, 500);\n    };\n    document.getElementById("jawab").appendChild(b);\n  }\n}\n\ndikhao();'
  }},

  notes: { name:"Notes (yaad rakhne ke liye)", files:{
    "index.html": '<!DOCTYPE html>\n<html lang="hi">\n<head>\n  <meta charset="utf-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1">\n  <title>Notes</title>\n  <link rel="stylesheet" href="style.css">\n</head>\n<body>\n  <h1>Mere notes</h1>\n  <textarea id="likho" placeholder="Aaj kya padha..."></textarea>\n  <p id="bataya"></p>\n\n  <script src="app.js">' + CLOSE_SCRIPT + '\n</body>\n</html>',
    "style.css": 'body { font-family: system-ui; background: #0b0f19; color: white; padding: 16px; }\ntextarea {\n  width: 100%; height: 60vh; font-size: 16px; padding: 14px;\n  border-radius: 12px; border: 1px solid #26324b; background: #131b28; color: white;\n}\n#bataya { color: #94a3c4; font-size: 13px; }',
    "app.js": '// Likhne par apne aap save ho jata hai\nconst likho = document.getElementById("likho");\n\nlikho.value = localStorage.getItem("notes") || "";\n\nlikho.oninput = function () {\n  localStorage.setItem("notes", likho.value);\n  document.getElementById("bataya").textContent = "Save ho gaya — " + likho.value.length + " akshar";\n};'
  }}
};

/* template ki list — simple naam aur ek line ka matlab */
const TPL_INFO = {
  hello: "Sabse aasan — ek heading aur ek button.",
  rang: "Button dabao, rang badal jayega.",
  pahada: "Number daalo, uska pahada dikhega.",
  khata: "Naam aur rupaye likho, total dikhega.",
  quiz: "Teen sawal, sahi jawab par score.",
  notes: "Jo likho wahi save ho jaye."
};

/* ---------------- state ---------------- */
let P = load(), cur = "index.html";

function load(){
  try{ const r = localStorage.getItem(LS); if (r){ const p = JSON.parse(r); if (p && p.files && Object.keys(p.files).length) return p; } }catch(e){}
  return JSON.parse(JSON.stringify(T.notes));
}
function save(){ try{ localStorage.setItem(LS, JSON.stringify(P)); return true; }catch(e){ return false; } }

/* ---------------- views ---------------- */
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
  ["files","code","build","prev"].forEach(v => {
    const el = $(v + "View");
    el.classList.toggle("on", v === b.dataset.v);
  });
});

function go(v){
  const b = [...document.querySelectorAll("nav button")].find(x => x.dataset.v === v);
  if (b) b.click();
}

/* ---------------- files ---------------- */
function paintFiles(){
  $("projName").textContent = P.name || "project";
  $("filesList").innerHTML = Object.keys(P.files).map(f =>
    `<div class="frow" data-f="${f}"><span class="nm">${f === cur ? "● " : ""}${f}</span><span class="del" data-del="${f}">✕</span></div>`
  ).join("");
  $("filesList").querySelectorAll(".frow").forEach(r => r.onclick = (e) => {
    if (e.target.dataset.del) return;
    openFile(r.dataset.f); go("code");
  });
  $("filesList").querySelectorAll("[data-del]").forEach(b => b.onclick = (e) => {
    e.stopPropagation();
    if (Object.keys(P.files).length <= 1) return;
    if (!confirm(b.dataset.del + " hatana hai?")) return;
    delete P.files[b.dataset.del];
    cur = Object.keys(P.files)[0];
    save(); paintFiles(); openFile(cur);
  });
}

function openFile(f){
  if (!(f in P.files)) return;
  cur = f;
  $("code").value = P.files[f];
  $("fname").textContent = f;
  paintLines(); paintFiles();
}

function paintLines(){
  const n = ($("code").value.match(/\n/g) || []).length + 1;
  $("lines").textContent = Array.from({length:n}, (_,i) => i+1).join("\n");
  $("stat").textContent = n + " line";
}

$("addFile").onclick = () => {
  const n = prompt("File ka naam (jaise page2.html, app.js, style.css):");
  if (!n) return;
  const name = n.trim().replace(/[^\w.\-]/g, "");
  if (!name) return;
  P.files[name] = "";
  save(); openFile(name); go("code");
};

$("code").addEventListener("input", () => { P.files[cur] = $("code").value; paintLines(); save(); });
$("code").addEventListener("scroll", () => { $("lines").scrollTop = $("code").scrollTop; });

/* touch snippets */
const SNIPS = ["<div>", "</div>", "<h1>", "<button>", "class=\"\"", "style=\"\"", "{", "}", "()", ";", "=", "\"\"", "<script>", "<link rel=\"stylesheet\" href=\"style.css\">"];
$("snip").innerHTML = SNIPS.map((s,i) => `<button data-s="${i}">${s.replace(/</g,"&lt;")}</button>`).join("");
$("snip").querySelectorAll("[data-s]").forEach(b => b.onclick = () => {
  const el = $("code"), s = el.selectionStart, e = el.selectionEnd;
  const txt = SNIPS[Number(b.dataset.s)];
  el.value = el.value.slice(0, s) + txt + el.value.slice(e);
  el.selectionStart = el.selectionEnd = s + txt.length;
  el.focus();
  P.files[cur] = el.value; paintLines(); save();
});

/* ---------------- build ---------------- */
function checkFile(f, code){
  if (/\.js$/i.test(f)){ try{ new Function(code); return { ok:true }; }catch(e){ return { ok:false, why:"JS: " + String(e.message).slice(0,70) }; } }
  if (/\.html$/i.test(f)){
    if (!/<html[\s>]/i.test(code)) return { ok:false, why:"<html> nahi mila" };
    if (!/<\/html>/i.test(code)) return { ok:false, why:"</html> band nahi hua" };
    if (!/<body/i.test(code)) return { ok:false, why:"<body> nahi mila" };
    return { ok:true };
  }
  if (/\.css$/i.test(f)){
    const o = (code.match(/{/g)||[]).length, c = (code.match(/}/g)||[]).length;
    if (Math.abs(o-c) > 2) return { ok:false, why:"braces " + o + "/" + c };
    return { ok:true };
  }
  return { ok:true };
}

function build(){
  const out = $("outBody");
  out.innerHTML = "";
  const add = (cls, m) => { const d = document.createElement("div"); d.className = cls; d.innerHTML = m; out.appendChild(d); };
  let fail = 0, warn = 0;
  const names = Object.keys(P.files);

  names.forEach(f => {
    const r = checkFile(f, P.files[f]);
    if (!r.ok){ fail++; add("bad", "❌ " + f + " — " + r.why); }
    else add("ok", "✅ " + f + " theek (" + P.files[f].split("\n").length + " line)");
  });

  const html = P.files["index.html"] || "";
  const refs = [...html.matchAll(/(?:href|src)="((?!https?:|#|data:)[^"]+)"/g)].map(m => m[1]);
  refs.forEach(r => { if (!r.includes("${") && !(r in P.files)){ warn++; add("warn", "⚠️ " + r + " file nahi hai (link toota)"); } });

  const all = names.map(n => P.files[n]).join("\n");
  if (!/<meta[^>]+viewport/i.test(html)) { warn++; add("warn", "⚠️ mobile viewport nahi — phone par theek nahi dikhega"); }
  if (!/localStorage/i.test(all)) { warn++; add("warn", "⚠️ data save nahi — refresh par sab chala jayega"); }
  if (!/try\s*\{/.test(all)) { warn++; add("warn", "⚠️ try/catch nahi — kuch toota to page blank"); }

  add(fail ? "bad" : (warn ? "warn" : "ok"),
      (fail ? "🔴 BUILD FAIL" : "🟢 BUILD PASS") + " — " + names.length + " file · " + fail + " tooti · " + warn + " chetavni");
  save();
  go("build");
  return fail === 0;
}

/* ---------------- run ---------------- */
function bundle(){
  let html = P.files["index.html"] || Object.values(P.files)[0] || "";
  const css = P.files["style.css"], js = P.files["app.js"];
  if (css) html = html.replace(/<link[^>]*style\.css[^>]*>/i, "<style>" + css + "</style>");
  if (js){
    const open = '<script src="app.js">' + CLOSE_SCRIPT;
    html = html.split(open).join("<script>" + js + CLOSE_SCRIPT);
  }
  return html;
}

/* ---------------- menu ---------------- */
$("menu").onclick = () => $("sheet").classList.add("on");
$("mClose").onclick = () => $("sheet").classList.remove("on");
const closeSheet = () => $("sheet").classList.remove("on");

$("mTemplate").onclick = () => {
  closeSheet();
  const list = $("tplList");
  list.innerHTML = Object.keys(T).map(k =>
    '<button class="srow" data-t="' + k + '">' + T[k].name + '<small>' + (TPL_INFO[k] || "") + '</small></button>'
  ).join("");
  list.querySelectorAll("[data-t]").forEach(b => b.onclick = () => {
    const k = b.dataset.t;
    if (!confirm("Purani files badal jayengi. Theek hai?")) return;
    P = JSON.parse(JSON.stringify(T[k]));
    cur = "index.html";
    save(); paintFiles(); openFile(cur);
    $("sheet2").classList.remove("on");
    go("files");
  });
  $("sheet2").classList.add("on");
};
$("tBack").onclick = () => $("sheet2").classList.remove("on");

$("mAI").onclick = async () => {
  closeSheet();
  const ask = prompt("AI se kya karwana hai? (jaise: 'is file me search box jodo')");
  if (!ask) return;
  go("build");
  $("outBody").innerHTML = '<div class="warn">🤖 AI likh raha hai…</div>';
  const prompt2 = "Tum expert developer ho. Neeche ek file hai. User ne kaha: \"" + ask + "\". "
    + "Sirf poora naya file content do — koi explanation nahi, koi code fence nahi. Mobile-first, Hinglish UI, bade touch buttons.\n\n"
    + "File: " + cur + "\n\n" + P.files[cur];
  let ans = null;
  try{ if (window.SeetalAPIs){ const a = await SeetalAPIs.ask(prompt2, { timeout: 25000 }); if (a.ok) ans = a.text; } }catch(e){}
  if (!ans){ $("outBody").innerHTML = '<div class="bad">❌ AI se jawab nahi aaya — net ya key check karo.</div>'; return; }
  ans = ans.replace(/^```[a-z]*\n?/i, "").replace(/```$/, "").trim();
  if (!confirm("AI ne naya code bheja. Badal dun?")) return;
  P.files[cur] = ans; $("code").value = ans; paintLines(); save();
  $("outBody").innerHTML = '<div class="ok">✅ ' + cur + ' update ho gayi — Build dabao.</div>';
};

$("mImport").onclick = async () => {
  closeSheet();
  const repo = prompt("GitHub repo — jaise bhupendarsingh785/my-app");
  if (!repo || !repo.includes("/")) return;
  const [owner, name] = repo.split("/");
  go("build");
  $("outBody").innerHTML = '<div class="warn">⬇️ La raha hoon…</div>';
  try{
    const r = await fetch("https://api.github.com/repos/" + owner + "/" + name + "/git/trees/main?recursive=1");
    const j = await r.json();
    const list = (j.tree || []).filter(x => x.type === "blob" && /\.(html|css|js|json|md)$/i.test(x.path) && x.size < 200000).slice(0, 12);
    if (!list.length){ $("outBody").innerHTML = '<div class="bad">Koi text file nahi mili.</div>'; return; }
    if (!confirm(list.length + " file mili. Purani files badal jayengi?")) return;
    const files = {};
    for (const f of list){
      const raw = await fetch("https://raw.githubusercontent.com/" + owner + "/" + name + "/main/" + f.path);
      if (raw.ok) files[f.path] = await raw.text();
    }
    P = { name, files };
    cur = files["index.html"] ? "index.html" : Object.keys(files)[0];
    save(); paintFiles(); openFile(cur); go("files");
  }catch(e){ $("outBody").innerHTML = '<div class="bad">Import fail: ' + e.message + '</div>'; }
};

$("mFind").onclick = () => {
  closeSheet();
  const q = prompt("Kya dhoondhna hai?");
  if (!q) return;
  go("build");
  $("outBody").innerHTML = "";
  let n = 0;
  Object.keys(P.files).forEach(f => {
    P.files[f].split("\n").forEach((line, i) => {
      if (line.toLowerCase().includes(q.toLowerCase())){
        n++;
        const d = document.createElement("div");
        d.className = "ok";
        d.innerHTML = "<b>" + f + ":" + (i+1) + "</b> — " + line.trim().slice(0,80);
        $("outBody").appendChild(d);
      }
    });
  });
  if (!n) $("outBody").innerHTML = '<div class="warn">Kuch nahi mila.</div>';
};

$("mDownload").onclick = () => {
  closeSheet();
  const html = bundle();
  const name = (P.name || "app").replace(/[^\w\-]/g, "") + ".html";
  const blob = new Blob([html], { type: "text/html;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  go("build");
  $("outBody").innerHTML = '<div class="ok">⬇️ ' + name + ' download ho gaya — phone me offline chalega.</div>';
};

$("mDeploy").onclick = async () => {
  closeSheet();
  const token = prompt("GitHub token (Contents: write):");
  if (!token) return;
  const repo = prompt("repo — jaise bhupendarsingh785/my-app");
  if (!repo || !repo.includes("/")) return;
  const [owner, name] = repo.split("/");
  go("build");
  $("outBody").innerHTML = '<div class="warn">🚀 Deploy kar raha hoon…</div>';
  for (const f of Object.keys(P.files)){
    const api = "https://api.github.com/repos/" + owner + "/" + name + "/contents/" + encodeURIComponent(f);
    const headers = { Authorization: "Bearer " + token.trim(), Accept: "application/vnd.github+json", "Content-Type": "application/json" };
    try{
      let sha = null;
      const r0 = await fetch(api + "?ref=main", { headers });
      if (r0.ok) sha = (await r0.json()).sha;
      const body = { message: "Seetal Studio: " + f, content: btoa(unescape(encodeURIComponent(P.files[f]))), branch: "main" };
      if (sha) body.sha = sha;
      const r = await fetch(api, { method: "PUT", headers, body: JSON.stringify(body) });
      const cls = r.ok ? "ok" : "bad";
      const d = document.createElement("div"); d.className = cls;
      d.textContent = (r.ok ? "✅ " : "❌ ") + f;
      $("outBody").appendChild(d);
    }catch(e){
      const d = document.createElement("div"); d.className = "bad"; d.textContent = "❌ " + f + " — " + e.message;
      $("outBody").appendChild(d);
    }
  }
  const d = document.createElement("div"); d.className = "ok";
  d.textContent = "Live (1-2 min): https://" + owner.toLowerCase() + ".github.io/" + name + "/";
  $("outBody").appendChild(d);
};

$("mRename").onclick = () => {
  closeSheet();
  const n = prompt("Naya project naam:", P.name || "project");
  if (!n) return;
  P.name = n.trim().replace(/[^\w\-]/g, "") || "project";
  save(); paintFiles();
};


/* ---------------- computer keyboard ---------------- */
document.addEventListener("keydown", (e) => {
  const ctrl = e.ctrlKey || e.metaKey;
  if (ctrl && e.key.toLowerCase() === "s"){ e.preventDefault(); save(); build(); }
  if (ctrl && e.key === "Enter"){ e.preventDefault(); build(); go("prev"); $("prev").srcdoc = bundle(); }
  if (ctrl && e.key.toLowerCase() === "n"){ e.preventDefault(); $("addFile").click(); }
});

/* Run tab dabane par preview banao */
document.querySelectorAll('nav button').forEach(b => {
  if (b.dataset.v === "prev") b.addEventListener("click", () => { $("prev").srcdoc = bundle(); });
});

/* ---------------- start ---------------- */
paintFiles(); openFile(cur);
