name: Deploy to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Account ID nikalo (secret na ho to token se)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_ACC" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID=$CF_ACC" >> $GITHUB_ENV
            echo "account id secret se mila"
          else
            ACC=$(curl -s -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/accounts | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['result'][0]['id'] if d.get('result') else '')")
            if [ -z "$ACC" ]; then echo "::error::Account ID nahi mila — token check karo"; exit 1; fi
            echo "CLOUDFLARE_ACCOUNT_ID=$ACC" >> $GITHUB_ENV
            echo "account id token se nikal liya"
          fi


      - name: workers.dev subdomain set karo (na ho to banao)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ACC="$CLOUDFLARE_ACCOUNT_ID"
          SUB=$(curl -s -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/subdomain" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print((d.get('result') or {}).get('subdomain') or '')")
          if [ -n "$SUB" ]; then
            echo "subdomain pehle se hai: $SUB"
            echo "CF_SUB=$SUB" >> $GITHUB_ENV
            exit 0
          fi
          for NAME in seetal seetal-app seetalapi bhupendar-seetal seetal-system; do
            CODE=$(curl -s -o /tmp/r.json -w "%{http_code}" -X PUT \
              -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              --data "{\"subdomain\":\"$NAME\"}" \
              "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/subdomain")
            if [ "$CODE" = "200" ]; then
              echo "subdomain ban gaya: $NAME"
              echo "CF_SUB=$NAME" >> $GITHUB_ENV
              exit 0
            fi
            echo "$NAME nahi chala ($CODE): $(cat /tmp/r.json | head -c 200)"
          done
          echo "::warning::Subdomain set nahi ho paya — dashboard se ek baar karna padega"

      - name: Wrangler install
        run: npm i -g wrangler@3

      - name: Deploy worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cd worker
          wrangler deploy --compatibility-date 2025-01-01
