name: Seetal Trader pulse

on:
  schedule:
    # har 5 minute - GitHub ka minimum
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pulse
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build data/live.json
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          SUPABASE_URL: https://urvhrcyuqepzpbklonrz.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 tools/snapshot.py
      - name: Commit if changed
        run: |
          git config user.name "seetal-trader-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/live.json
          if git diff --quiet --cached; then
            echo "koi badlav nahi"
          else
            git commit -m "pulse: $(date -u +%FT%TZ)"
            git push
          fi
