name: Connections — sab jude hain?

# Har 15 minute: saari services ek-ek check karta hai.
# Sirf tab shor karta hai jab kuch TOOTA ho (issue banata hai).

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: connections-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Sab connections jaancho
        id: run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BITBUCKET_USER: ${{ secrets.BITBUCKET_USER }}
          BITBUCKET_APP_PASSWORD: ${{ secrets.BITBUCKET_APP_PASSWORD }}
          PHONEPE_APPSTORE_API_TOKEN: ${{ secrets.PHONEPE_APPSTORE_API_TOKEN }}
        run: |
          set -uo pipefail
          mkdir -p status
          OUT=status/connections.json
          echo '{' > "$OUT"
          FAILED=""

          chk () {  # name url [header]
            local name="$1" url="$2" hdr="${3:-}"
            local code
            if [ -n "$hdr" ]; then
              code=$(curl -s -o /dev/null -m 20 -w '%{http_code}' -H "$hdr" "$url" || echo 000)
            else
              code=$(curl -s -o /dev/null -m 20 -w '%{http_code}' "$url" || echo 000)
            fi
            local ok=false note=""
            case "$code" in
              2*|3*) ok=true ;;
              429)   ok=true; note=", \"note\": \"rate limit (site ne thoda roka, connection theek hai)\"" ;;
            esac
            printf '  "%s": {"code": "%s", "ok": %s%s},\n' "$name" "$code" "$ok" "$note" >> "$OUT"
            echo "$([ "$ok" = true ] && echo ✅ || echo ❌) $name ($code)"
            [ "$ok" = false ] && FAILED="$FAILED $name"
            return 0
          }

          echo "--- sites ---"
          chk "pages"     "https://bhupendarsingh785.github.io/seetal-trader/"
          chk "youme"     "https://bhupendarsingh785.github.io/seetal-trader/youme.html"
          chk "suno"      "https://bhupendarsingh785.github.io/suno-assistant/"
          chk "vercel"    "https://bhupendarsingh785.vercel.app/"
          chk "cloudflare" "https://seetal-api.bhupendarsingh785.workers.dev/status"

          echo "--- mirrors ---"
          chk "gitlab"    "https://gitlab.com/Bhuprndar785/bhupendarsingh785/-/raw/main/index.html"
          chk "codeberg"  "https://codeberg.org/bhupendarsingh785/seetal-trader/raw/branch/main/index.html"
          if [ -n "${BITBUCKET_USER:-}" ] && [ -n "${BITBUCKET_APP_PASSWORD:-}" ]; then
            chk "bitbucket" "https://api.bitbucket.org/2.0/repositories/bhupendarsingh785/seetal-trader" \
              "Authorization: Basic $(printf '%s:%s' "$BITBUCKET_USER" "$BITBUCKET_APP_PASSWORD" | base64 -w0)"
          else
            echo "  bitbucket skip (secrets nahi)"; printf '  "bitbucket": {"code": "skip", "ok": true},\n' >> "$OUT"
          fi

          echo "--- tokens (API se) ---"
          if [ -n "${GITLAB_TOKEN:-}" ]; then
            GT="$(printf '%s' "$GITLAB_TOKEN" | tr -d '[:space:]')"
            GC=$(curl -s -o /dev/null -m 20 -w '%{http_code}' -H "PRIVATE-TOKEN: $GT" https://gitlab.com/api/v4/user || echo 000)
            if [ "$GC" = "200" ] || [ "$GC" = "403" ]; then
              # 403 = token zinda hai, bas api-scope nahi (mirror ke liye kaafi hai)
              echo "✅ gitlab_token ($GC)"; printf '  "gitlab_token": {"code": "%s", "ok": true},\n' "$GC" >> "$OUT"
            else
              echo "❌ gitlab_token ($GC)"; printf '  "gitlab_token": {"code": "%s", "ok": false},\n' "$GC" >> "$OUT"; FAILED="$FAILED gitlab_token"
            fi
          else echo "  gitlab_token skip"; fi
          if [ -n "${NETLIFY_AUTH_TOKEN:-}" ]; then
            chk "netlify_token" "https://api.netlify.com/api/v1/user" "Authorization: Bearer $(printf '%s' "$NETLIFY_AUTH_TOKEN" | tr -d '[:space:]')"
          else echo "  netlify_token skip"; fi
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            CC=$(curl -s -o /dev/null -m 20 -w '%{http_code}' -H "Authorization: Bearer $(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')" https://api.cloudflare.com/client/v4/user/tokens/verify || echo 000)
            if [ "$CC" = "200" ]; then
              echo "✅ cloudflare_token (200)"; printf '  "cloudflare_token": {"code": "200", "ok": true},\n' >> "$OUT"
            else
              # token par verify-permission nahi hai; worker alag se check hota hai
              echo "⚠️ cloudflare_token check nahi hua ($CC) — worker ka status upar dekho"
              printf '  "cloudflare_token": {"code": "%s", "ok": true, "note": "verify permission nahi"},\n' "$CC" >> "$OUT"
            fi
          else echo "  cloudflare_token skip"; fi
          if [ -n "${PHONEPE_APPSTORE_API_TOKEN:-}" ]; then
            echo "  phonepe_token present (API par sirf upload hota hai)"
          else echo "  phonepe_token skip"; fi

          echo '  "_end": true' >> "$OUT"
          echo '}' >> "$OUT"
          echo "FAILED=${FAILED# }" >> "$GITHUB_ENV"
          python3 -c "import json;d=json.load(open('status/connections.json'));bad=[k for k,v in d.items() if isinstance(v,dict) and not v.get('ok',True)];print('toota:', bad or 'kuch nahi')"

      - name: Status commit karo
        run: |
          git config user.name "OpenYug"
          git config user.email "openyug@seetal.local"
          git add status/connections.json || true
          git commit -m "connections: $(date -u +%FT%TZ)" || echo "koi badlav nahi"
          git push || echo "push skip"

      - name: Kuch toota to issue banao
        if: env.FAILED != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Connection toota: $FAILED"
          EXISTS=$(gh issue list --search "$TITLE in:title" --state open --json number --jq 'length' 2>/dev/null || echo 0)
          if [ "$EXISTS" = "0" ]; then
            {
              echo "Ye connections abhi jawab nahi de rahe: **$FAILED**"
              echo
              echo "Waqt: $(date -u +%FT%TZ)"
              echo
              echo "Poori list: \`status/connections.json\`"
            } > /tmp/issue.md
            gh issue create --title "$TITLE" --body-file /tmp/issue.md || true
          else
            echo "Issue pehle se hai — naya nahi banaya"
          fi
